<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Chod Cognitive System | Command Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #030712;
            color: #38bdf8;
            font-family: 'Segoe UI', 'Courier New', monospace;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            padding: 16px;
        }
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.015) 1px, transparent 1px);
            background-size: 30px 30px;
            background-position: center;
            pointer-events: none;
        }

        .toggle-btn {
            position: fixed;
            top: clamp(8px, 2vh, 16px);
            right: clamp(8px, 2vw, 16px);
            z-index: 9999;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #38bdf8;
            font-size: clamp(16px, 4vw, 22px);
            width: clamp(36px, 8vw, 48px);
            height: clamp(36px, 8vw, 48px);
            border-radius: 50%;
            cursor: pointer;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Courier New', monospace;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.1);
            touch-action: manipulation;
        }
        .toggle-btn:hover {
            background: rgba(56, 189, 248, 0.25);
            border-color: #38bdf8;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.3);
            transform: scale(1.05);
        }
        .toggle-btn:active {
            transform: scale(0.92);
        }
        .toggle-btn .icon-cmd { 
            font-size: clamp(12px, 3vw, 16px); 
            font-weight: bold; 
            letter-spacing: 1px; 
        }

        .portal-card {
            background: rgba(4, 11, 23, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: clamp(8px, 2vw, 16px);
            padding: clamp(20px, 5vw, 45px);
            text-align: center;
            max-width: min(500px, 92vw);
            width: 92%;
            box-shadow: 0 0 40px rgba(56, 189, 248, 0.1), inset 0 0 20px rgba(56, 189, 248, 0.05);
            position: relative;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .portal-card::before {
            content: ""; 
            position: absolute; 
            top: -1px; 
            left: -1px; 
            width: clamp(14px, 3vw, 20px); 
            height: clamp(14px, 3vw, 20px); 
            border-top: clamp(2px, 0.4vw, 3px) solid #38bdf8; 
            border-left: clamp(2px, 0.4vw, 3px) solid #38bdf8; 
            border-top-left-radius: clamp(3px, 0.6vw, 6px);
        }
        .portal-card::after {
            content: ""; 
            position: absolute; 
            bottom: -1px; 
            right: -1px; 
            width: clamp(14px, 3vw, 20px); 
            height: clamp(14px, 3vw, 20px); 
            border-bottom: clamp(2px, 0.4vw, 3px) solid #38bdf8; 
            border-right: clamp(2px, 0.4vw, 3px) solid #38bdf8; 
            border-bottom-right-radius: clamp(3px, 0.6vw, 6px);
        }
        .portal-card.hidden {
            display: none !important;
        }

        .title {
            font-size: clamp(18px, 5vw, 30px);
            font-weight: bold;
            letter-spacing: clamp(2px, 0.6vw, 6px);
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
            margin-bottom: clamp(6px, 1.5vw, 12px);
            word-break: break-word;
        }
        .subtitle {
            font-size: clamp(9px, 2vw, 13px);
            color: #475569;
            letter-spacing: clamp(1px, 0.3vw, 3px);
            text-transform: uppercase;
            margin-bottom: clamp(16px, 4vw, 32px);
        }
        .launch-btn {
            background: rgba(168, 85, 247, 0.15);
            border: 1px solid rgba(168, 85, 247, 0.5);
            color: #e9d5ff;
            font-family: 'Courier New', monospace;
            font-size: clamp(11px, 2.5vw, 15px);
            font-weight: bold;
            letter-spacing: clamp(1px, 0.3vw, 3px);
            padding: clamp(12px, 3vw, 18px) clamp(20px, 5vw, 36px);
            cursor: pointer;
            border-radius: clamp(4px, 0.8vw, 8px);
            text-shadow: 0 0 8px rgba(168, 85, 247, 0.6);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.2);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            touch-action: manipulation;
            width: 100%;
            max-width: 320px;
        }
        .launch-btn:hover {
            background: rgba(168, 85, 247, 0.35);
            border-color: #c084fc;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.5);
            color: #fff;
            transform: scale(1.05);
        }
        .launch-btn:active {
            transform: scale(0.97);
        }
        .status-text {
            font-size: clamp(9px, 2vw, 12px);
            color: #10b981;
            margin-top: clamp(16px, 4vw, 28px);
            letter-spacing: clamp(1px, 0.2vw, 2px);
        }

        @media (max-width: 480px) {
            body { padding: 12px; }
            .portal-card { padding: 20px 16px; width: 96%; }
            .title { font-size: 18px; letter-spacing: 2px; }
            .subtitle { font-size: 9px; margin-bottom: 20px; }
            .launch-btn { font-size: 12px; padding: 14px 20px; }
            .toggle-btn { width: 38px; height: 38px; font-size: 16px; top: 10px; right: 10px; }
        }

        @media (max-width: 380px) {
            .portal-card { padding: 16px 12px; }
            .title { font-size: 16px; letter-spacing: 1px; }
            .subtitle { font-size: 8px; margin-bottom: 16px; }
            .launch-btn { font-size: 11px; padding: 12px 16px; letter-spacing: 1px; }
            .toggle-btn { width: 34px; height: 34px; font-size: 14px; top: 8px; right: 8px; }
        }

        @media (max-height: 500px) and (orientation: landscape) {
            body { padding: 8px 16px; align-items: flex-start; padding-top: 20px; }
            .portal-card { padding: 16px 24px; max-width: 70vw; }
            .title { font-size: clamp(16px, 3.5vh, 22px); margin-bottom: 4px; }
            .subtitle { font-size: clamp(8px, 1.8vh, 10px); margin-bottom: 12px; }
            .launch-btn { padding: 8px 20px; font-size: clamp(10px, 2vh, 13px); max-width: 280px; }
            .status-text { margin-top: 10px; font-size: clamp(8px, 1.5vh, 10px); }
            .toggle-btn { width: 32px; height: 32px; font-size: 14px; top: 6px; right: 6px; }
        }
    </style>
</head>
<body>

    <button class="toggle-btn" id="togglePortalBtn" title="เปิด/ปิด Portal">
        <span class="icon-cmd">⌘</span>
    </button>

    <div class="portal-card hidden" id="portalCard">
        <div class="title">CHOD COGNITIVE SYSTEM</div>
        <div class="subtitle">Central Command & 6-Relay Deck</div>
        <button class="launch-btn" id="launchBtn">LAUNCH COGNITIVE MONITOR</button>
        <div class="status-text">● SECURE SYNC LINK DETECTED</div>
    </div>

    <script>
        window.ChodBrain = {
            neurotransmitters: { dopamine: 0.5, serotonin: 0.6, adrenaline: 0.3 },
            frustrationScore: 0.2
        };

        setInterval(() => {
            if (window.ChodBrain && window.ChodBrain.neurotransmitters) {
                const now = Date.now();
                window.ChodBrain.neurotransmitters.dopamine = 0.4 + Math.sin(now * 0.001) * 0.18 + Math.random() * 0.04;
                window.ChodBrain.neurotransmitters.serotonin = 0.5 + Math.cos(now * 0.0007) * 0.14 + Math.random() * 0.04;
                window.ChodBrain.neurotransmitters.adrenaline = 0.3 + Math.sin(now * 0.0015) * 0.12 + Math.random() * 0.04;
                window.ChodBrain.frustrationScore = 0.2 + Math.cos(now * 0.0005) * 0.11;
            }
        }, 300);

        document.getElementById("launchBtn").addEventListener("click", () => {
            if (window.ChodBrainMonitor && typeof window.ChodBrainMonitor.show === "function") {
                window.ChodBrainMonitor.show();
            } else {
                alert("กรุณาตรวจสอบว่าโหลดสคริปต์ควบคุมส่วนต่าง ๆ ครบถ้วนแล้วครับเจ้านาย");
            }
        });

        document.getElementById("togglePortalBtn").addEventListener("click", function() {
            document.getElementById("portalCard").classList.toggle("hidden");
        });
    </script>

    <script src="AIMr-Chod.js"></script>
    <script src="visualizer-globals.js"></script>
    <script src="visualizer-ui.js"></script>
    <script src="visualizer-voice.js"></script>
    <script src="visualizer-brain-physics.js"></script>
    <script src="Advanced-Voice-Commands.js"></script>
    <script src="telegram.js"></script>

</body>
</html>
