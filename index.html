<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Chod Cognitive System | Command Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #030712;
            color: #38bdf8;
            font-family: 'Segoe UI', 'Courier New', monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.015) 1px, transparent 1px);
            background-size: 30px 30px;
            background-position: center;
            pointer-events: none;
        }

        /* ===== ปุ่มเล็กๆ มุมบนขวา ===== */
        .toggle-btn {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 9999;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #38bdf8;
            font-size: 18px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            backdrop-filter: blur(6px);
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Courier New', monospace;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.1);
        }
        .toggle-btn:hover {
            background: rgba(56, 189, 248, 0.25);
            border-color: #38bdf8;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.3);
            transform: scale(1.05);
        }
        .toggle-btn:active {
            transform: scale(0.92);
        }
        /* ไอคอนในปุ่ม (ใช้สัญลักษณ์แทนข้อความ) */
        .toggle-btn .icon-cmd { font-size: 14px; font-weight: bold; letter-spacing: 1px; }

        /* ===== Portal Card ===== */
        .portal-card {
            background: rgba(4, 11, 23, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 0 40px rgba(56, 189, 248, 0.1), inset 0 0 20px rgba(56, 189, 248, 0.05);
            position: relative;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .portal-card::before {
            content: ""; position: absolute; top: -1px; left: -1px; width: 20px; height: 20px; border-top: 3px solid #38bdf8; border-left: 3px solid #38bdf8; border-top-left-radius: 4px;
        }
        .portal-card::after {
            content: ""; position: absolute; bottom: -1px; right: -1px; width: 20px; height: 20px; border-bottom: 3px solid #38bdf8; border-right: 3px solid #38bdf8; border-bottom-right-radius: 4px;
        }
        /* คลาสสำหรับซ่อน (ใช้คู่กับ JS) */
        .portal-card.hidden {
            display: none !important;
        }

        .title {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 4px;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
            margin-bottom: 10px;
        }
        .subtitle {
            font-size: 11px;
            color: #475569;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 30px;
        }
        .launch-btn {
            background: rgba(168, 85, 247, 0.15);
            border: 1px solid rgba(168, 85, 247, 0.5);
            color: #e9d5ff;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 2px;
            padding: 15px 30px;
            cursor: pointer;
            border-radius: 6px;
            text-shadow: 0 0 8px rgba(168, 85, 247, 0.6);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.2);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .launch-btn:hover {
            background: rgba(168, 85, 247, 0.35);
            border-color: #c084fc;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.5);
            color: #fff;
            transform: scale(1.05);
        }
        .status-text {
            font-size: 10px;
            color: #10b981;
            margin-top: 25px;
            letter-spacing: 1px;
        }

        /* Responsive สำหรับมือถือ 6.0 นิ้ว */
        @media (max-width: 600px) {
            .portal-card {
                padding: 30px 20px;
            }
            .title {
                font-size: 19px;
                letter-spacing: 2px;
            }
            .subtitle {
                font-size: 9px;
                margin-bottom: 25px;
            }
            .launch-btn {
                padding: 12px 22px;
                font-size: 11px;
            }
            .toggle-btn {
                top: 12px;
                right: 12px;
                width: 36px;
                height: 36px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== ปุ่มเล็ก ๆ มุมบนขวา ===== -->
    <button class="toggle-btn" id="togglePortalBtn" title="เปิด/ปิด Portal">
        <span class="icon-cmd">⌘</span>
    </button>

    <!-- ===== Portal Card ===== -->
    <div class="portal-card hidden" id="portalCard">
        <div class="title">CHOD COGNITIVE SYSTEM</div>
        <div class="subtitle">Central Command & 6-Relay Deck</div>
        
        <button class="launch-btn" id="launchBtn">
            LAUNCH COGNITIVE MONITOR
        </button>
        
        <div class="status-text">● SECURE SYNC LINK DETECTED</div>
    </div>

    <script>
        // ----- ระบบ ChodBrain (เดิม) -----
        window.ChodBrain = {
            neurotransmitters: {
                dopamine: 0.5,
                serotonin: 0.6,
                adrenaline: 0.3
            },
            frustrationScore: 0.2
        };

        setInterval(() => {
            if (window.ChodBrain && window.ChodBrain.neurotransmitters) {
                const now = Date.now();
                window.ChodBrain.neurotransmitters.dopamine = 0.4 + Math.sin(now * 0.001) * 0.18 + Math.random() * 0.04;
                window.ChodBrain.neurotransmitters.serotonin = 0.5 + Math.cos(now * 0.0007) * 0.14 + Math.random() * 0.04;
                window.ChodBrain.neurotransmitters.adrenaline = 0.3 + Math.sin(now * 0.0015) * 0.12 + Math.random() * 0.04;
                window.ChodBrain.frustrationScore = 0.2 + Math.cos(now * 0.0005) * 0.11;
            }
        }, 300);

        // ปุ่ม LAUNCH (เดิม)
        document.getElementById("launchBtn").addEventListener("click", () => {
            if (window.ChodBrainMonitor && typeof window.ChodBrainMonitor.show === "function") {
                window.ChodBrainMonitor.show();
            } else {
                alert("กรุณาตรวจสอบว่าโหลดสคริปต์ควบคุมส่วนต่าง ๆ ครบถ้วนแล้วครับเจ้านาย");
            }
        });

        // ----- ปุ่ม toggle แสดง/ซ่อน Portal Card (มุมบนขวา) -----
        document.getElementById("togglePortalBtn").addEventListener("click", function() {
            const card = document.getElementById("portalCard");
            card.classList.toggle("hidden");
        });
    </script>

    <!-- สคริปต์ภายนอก (โหลดเหมือนเดิม) -->
    <script src="AIMr-Chod.js"></script>
    <script src="visualizer-globals.js"></script>
    <script src="visualizer-ui.js"></script>
    <script src="visualizer-voice.js"></script>
    <script src="visualizer-brain-physics.js"></script>
           <!-- แทรกโมดูลวิเคราะห์เสียงคำสั่งขั้นสูงตัวนี้ไว้บรรทัดล่างสุด -->
    <script src="Advanced-Voice-Commands.js"></script>
             <!-- แทรกโมดูลเชื่อมต่อ Telegram ตรงจุดนี้ -->
    <script src="telegram.js"></script>
 

</body>
</html>
