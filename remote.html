<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>นายชด - Mobile Controller</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 20px;
            color: #38bdf8;
            margin: 0 0 4px 0;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
        }
        .header p {
            font-size: 11px;
            color: #64748b;
            margin: 0;
        }
        .mic-container {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: rgba(30, 41, 59, 0.8);
            border: 4px solid #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: all 0.3s;
            margin-bottom: 24px;
            position: relative;
        }
        .mic-container.active {
            border-color: #22c55e;
            box-shadow: 0 0 20px rgba(34, 197, 90, 0.6);
            transform: scale(1.05);
        }
        .mic-icon {
            font-size: 48px;
            transition: transform 0.2s;
        }
        .mic-container.active .mic-icon {
            transform: scale(1.1);
        }
        .status-txt {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 16px;
            height: 18px;
            font-weight: bold;
        }
        .channel-info {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-family: monospace;
            color: #38bdf8;
            margin-bottom: 24px;
        }
        .grid-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 340px;
        }
        .btn-action {
            background: #1e293b;
            color: #cbd5e1;
            border: 1px solid #334155;
            padding: 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.25);
        }
        .btn-action:active {
            background: #38bdf8;
            color: #0f172a;
            border-color: #38bdf8;
            transform: translateY(2px);
            box-shadow: none;
        }
        .btn-action.batch {
            grid-column: span 2;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: #fff;
            border-color: #38bdf8;
        }
        .btn-action.batch:active {
            background: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>AI CHOD REMOTE</h1>
        <p>รีโมทควบคุมสั่งงานด้วยเสียงบนโทรศัพท์มือถือ</p>
    </div>

    <div class="channel-info" id="channel-display">Channel: Connecting...</div>

    <div class="mic-container" id="mic-btn">
        <span class="mic-icon" id="mic-icon">🎙️</span>
    </div>

    <div class="status-txt" id="status-display">แตะปุ่มไมค์เพื่อพูดสั่งงาน</div>

    <div class="grid-buttons">
        <button class="btn-action batch" onclick="sendCommand('ลบพื้นหลังกลุ่ม')">✨ ลบพื้นหลังกลุ่มอัตโนมัติ</button>
        <button class="btn-action" onclick="sendCommand('ลบพื้นหลัง')">✂️ ลบพื้นหลังรูปนี้</button>
        <button class="btn-action" onclick="sendCommand('รีเซ็ต')">🔄 รีเซ็ตเลเยอร์</button>
        <button class="btn-action" onclick="sendCommand('ล็อคเลเยอร์')">🔒 ล็อคเลเยอร์</button>
        <button class="btn-action" onclick="sendCommand('ลบเลเยอร์')">❌ ลบเลเยอร์</button>
    </div>

    <script>
        // ดึงช่องสัญญาณรีโมทผ่านแฮชลิงก์ URL (#)
        let channel = window.location.hash.substring(1) || 'chod_remote_default';
        document.getElementById('channel-display').textContent = `Channel: ${channel}`;

        async function sendCommand(text) {
            if (!text || text.trim() === "") return;
            const statusDisplay = document.getElementById('status-display');
            statusDisplay.textContent = `กำลังส่ง: "${text}"...`;
            
            try {
                // ส่ง POST Request คำสั่งไปยัง ntfy.sh เพื่อกระจายสัญญาณเรียลไทม์ไปยังบราวเซอร์คอมพิวเตอร์ [1]
                await fetch(`https://ntfy.sh/${channel}`, {
                    method: 'POST',
                    body: text
                });
                statusDisplay.textContent = `ส่งคำสั่งเรียบร้อยแล้ว`;
                setTimeout(() => {
                    statusDisplay.textContent = "แตะปุ่มไมค์เพื่อพูดสั่งงาน";
                }, 1500);
            } catch (err) {
                statusDisplay.textContent = `ส่งคำสั่งผิดพลาด`;
                console.error(err);
            }
        }

        // --- ระบบสั่งการด้วยเสียงบนอุปกรณ์มือถือ (iOS / Android Web Speech API) ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'th-TH';
            recognition.continuous = false;
            recognition.interimResults = false;

            const micBtn = document.getElementById('mic-btn');
            const micIcon = document.getElementById('mic-icon');
            const statusDisplay = document.getElementById('status-display');
            let isListening = false;

            micBtn.onclick = () => {
                if (isListening) {
                    recognition.stop();
                } else {
                    recognition.start();
                }
            };

            recognition.onstart = () => {
                isListening = true;
                micBtn.classList.add('active');
                micIcon.textContent = '🔊';
                statusDisplay.textContent = '🔊 กำลังฟัง... พูดคำสั่งเสียงได้เลย';
            };

            recognition.onend = () => {
                isListening = false;
                micBtn.classList.remove('active');
                micIcon.textContent = '🎙️';
            };

            recognition.onresult = (e) => {
                const resultText = e.results[0][0].transcript;
                sendCommand(resultText);
            };

            recognition.onerror = (e) => {
                statusDisplay.textContent = 'ไม่เข้าใจคำเสียง หรือไมค์ไม่พร้อมทำงาน';
                console.warn(e.error);
            };
        } else {
            document.getElementById('status-display').textContent = 'เบราว์เซอร์นี้ไม่รองรับระบบสั่งงานด้วยเสียงแบบเรียลไทม์';
            document.getElementById('mic-btn').style.opacity = '0.5';
        }
    </script>
</body>
</html>
